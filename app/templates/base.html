<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Анализ ЭКГ{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css', v='20260602c') }}">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="brand" aria-label="На главную">
                <span class="brand__logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        <polyline points="3.5 12 8 12 10 9 14 15 16 12 20.5 12"/>
                    </svg>
                </span>
                <span class="brand__title">
                    <span>Анализ ЭКГ</span>
                    <span class="brand__subtitle">ИИ-классификация 12-канальных записей</span>
                </span>
            </a>
            <nav class="nav" aria-label="Главная навигация">
                <a href="/" class="nav__link {% if request.path == '/' %}nav__link--active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                    Загрузка
                </a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>ИИ-анализ ЭКГ · DenseNet121-1D · Локальный запуск</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/icons.js', v='20260601c') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js', v='20260601c') }}"></script>
    <script src="{{ url_for('static', filename='js/modal.js', v='20260601c') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
